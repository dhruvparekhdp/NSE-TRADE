name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass market-hours block"
        required: false
        default: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          NSE_FORCE_PAPER: "1"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Block market hours
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          pip install -q -r requirements.txt
          python -m scripts.market_hours_guard --force "$FORCE"
      - name: SSH deploy
        if: ${{ secrets.EC2_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/nse-engine
            git pull --ff-only
            .venv/bin/pip install -q -r requirements.txt
            sudo systemctl restart nse-engine
            sleep 8
            curl -fs 127.0.0.1:8090/api/health
