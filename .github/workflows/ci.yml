name: ci

# NSE-001: every push and every pull request. Tests are offline.
# Nothing here logs in to Angel or places an order.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NSE_FORCE_PAPER: "1"
      MODE: paper
      LIVE_ORDERS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Tests
        run: make test
      - name: pip-audit
        run: make audit
      - name: gitleaks working tree
        run: make secrets
      - name: gitleaks history (report only)
        continue-on-error: true
        run: make secrets-history
