[project]
name = "nse-engine"
version = "0.0.1"
description = "NSE equity engine on Angel One SmartAPI (paper-first)"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"web/keys.py" = ["E501"]
"tests/test_portal_api.py" = ["E501", "UP038"]
"web/portal_data.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::aiohttp.web_exceptions.NotAppKeyWarning",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
files = [
  "broker",
  "config",
  "core",
  "data",
  "engine",
  "integrations",
  "lab",
  "news",
  "notify",
  "scripts",
  "storage",
  "strategies",
  "web",
  "tests",
]
exclude = ["(?x)(\\.venv/|var/|data/lake/|data/reports/)"]

# NSE-001: these modules already fail mypy. They stay unchecked so `make typecheck`
# can run in CI without a behavior-changing cleanup. Drop a module from this list
# once it typechecks clean.
[[tool.mypy.overrides]]
module = [
  "config.settings",
  "data.history",
  "engine.state",
  "lab.backtest",
  "lab.ledger",
  "lab.portfolio",
  "notify.telegram",
  "scripts.run_prereg_trials",
  "strategies.gap",
  "strategies.registry",
  "tests.test_portal_api",
  "tests.test_strategies_lab",
  "tests.test_v2_daily_fills",
  "web.portal_api",
  "web.portal_data",
]
ignore_errors = true
